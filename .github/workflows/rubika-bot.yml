name: Rubika Mod Bot

on:
  schedule:
    # هر ۱۵ دقیقه اجرا می‌شود (برای پاسخ‌گویی سریع‌تر در پیوی + دقت زمان‌بندی پست‌ها)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rubika-mod-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (collect + post + owner DM)
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
        run: python run_bot.py

      - name: Save updated state.json back to the repo
        run: |
          git config user.name "rubika-mod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "update state [skip ci]"
          git pull --rebase || true
          git push
